name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # versionCode 来自 git rev-list --count HEAD，浅克隆会恒为 1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # runner 已预装 Android SDK 但未导出 ANDROID_HOME，需自行定位并写回环境。
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          fi
          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -maxdepth 4 -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Read APK metadata
        id: meta
        run: |
          META=app/build/outputs/apk/debug/output-metadata.json
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "versionCode=$(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_OUTPUT"
          echo "versionName=$(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_OUTPUT"
          echo "### newBV Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: $(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionName: $(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: newBV-debug-${{ steps.meta.outputs.versionCode }}-${{ github.run_number }}
          path: |
            ${{ steps.meta.outputs.apk }}
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error

  checks:
    name: Unit Tests & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 同 build job：runner 预装 SDK + sdkmanager 补装，需自行导出 ANDROID_HOME。
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          fi
          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -maxdepth 4 -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run ktlint and detekt
        run: ./gradlew ktlintCheck detekt --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
          if-no-files-found: ignore
